name: 缺陷反馈 (Bug Report)
description: 反馈 Knooo 使用过程中遇到的异常或崩溃
labels: ["bug"]
body:
  - type: input
    id: version
    attributes:
      label: Knooo 版本
      placeholder: 例如 v0.1.3（可在「关于」页查看）
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: 操作系统环境
      placeholder: 例如 Windows 11 x64 / WSL Ubuntu 24.04
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 打开 ...
        2. 点击 ...
        3. 出现 ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期表现与实际表现
      placeholder: 请描述你期望发生什么，以及实际发生了什么。
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 补充信息（日志 / 截图，请脱敏密钥与隐私路径）
      placeholder: 可粘贴「平台日志」中的相关错误信息或截图。
