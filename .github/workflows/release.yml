name: Windows x64 release

on:
  push:
    tags:
      - 'v[0-9]*'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.23.1'
          cache: npm
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: '1.27.4'
      - name: Extract release notes
        run: |
          mkdir -p build
          bash packaging/release-notes.sh "$GITHUB_REF_NAME" > build/release-notes.md
      - name: Build frontend and test backend
        run: |
          npm ci --registry=https://registry.npmjs.org --replace-registry-host=always
          npm run build
          go test ./...
      - name: Build Windows x64 packages
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.+-]+)?$ ]]; then
            echo "Use a version tag such as v0.1.0 or v0.1.0-rc.1."
            exit 1
          fi
          sudo apt-get update
          sudo apt-get install -y nsis=3.09-4ubuntu1 nsis-common=3.09-4ubuntu1
          mkdir -p build
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -buildvcs=false \
            -ldflags "-H=windowsgui -X main.version=$version" -o build/Knooo-windows-x64.exe .
          makensis -WX -DAPP_VERSION="$version" packaging/windows.nsi
          cd build
          sha256sum Knooo-windows-x64.exe Knooo-Setup-windows-x64.exe > SHA256SUMS.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: windows-x64
          path: |
            build/Knooo-windows-x64.exe
            build/Knooo-Setup-windows-x64.exe
            build/SHA256SUMS.txt
            build/release-notes.md
          if-no-files-found: error

  smoke-windows:
    needs: build
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: windows-x64
      - name: Verify installation, in-place update, and uninstall
        shell: pwsh
        run: |
          $setup = Join-Path $PWD 'Knooo-Setup-windows-x64.exe'
          $target = Join-Path $env:RUNNER_TEMP 'Knooo Smoke'
          $installed = Join-Path $target 'Knooo-Studio.exe'
          $uninstaller = Join-Path $target 'Uninstall.exe'
          $expected = (Get-FileHash 'Knooo-windows-x64.exe').Hash
          $key = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\KnoooStudio'
          $runKey = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run'

          $install = Start-Process -FilePath $setup -ArgumentList "/S /D=$target" -PassThru -Wait
          if ($install.ExitCode -ne 0 -or (Get-FileHash $installed).Hash -ne $expected) {
            throw 'Installed binary did not match the release artifact'
          }
          if ((Get-ItemProperty $key).InstallLocation -ne $target) {
            throw 'Installer did not register its installation directory'
          }
          if (!(Test-Path -LiteralPath $uninstaller) -or
              (Get-ItemProperty -Path $runKey -ErrorAction SilentlyContinue).KnoooStudio) {
            throw 'The uninstaller is missing or startup was enabled by default'
          }
          $startup = '"{0}" --tray' -f $installed
          if (!(Test-Path $runKey)) { New-Item -Path $runKey | Out-Null }
          Set-ItemProperty -Path $runKey -Name KnoooStudio -Value $startup

          Add-Content -LiteralPath $installed -Value 'previous installation marker'
          $exiting = Start-Process -FilePath (Get-Command pwsh).Source `
            -ArgumentList '-NoProfile -Command "Start-Sleep -Seconds 5"' -PassThru
          $upgrade = Start-Process -FilePath $setup -ArgumentList "/S /UPDATEPID=$($exiting.Id)" -PassThru
          if (!$upgrade.WaitForExit(60000) -or $upgrade.ExitCode -ne 0 -or (Get-FileHash $installed).Hash -ne $expected) {
            throw 'The in-place update did not restore the release binary'
          }
          if ((Get-ItemPropertyValue -Path $runKey -Name KnoooStudio) -ne $startup) {
            throw 'The in-place update changed the startup preference'
          }
          $deadline = (Get-Date).AddSeconds(15)
          do {
            $app = Get-Process -Name 'Knooo-Studio' -ErrorAction SilentlyContinue |
              Where-Object { $_.Path -eq $installed }
            if (!$app) { Start-Sleep -Milliseconds 250 }
          } until ($app -or (Get-Date) -ge $deadline)
          if (!$app -or $app.WaitForExit(3000)) { throw 'Knooo did not stay running after the in-place update' }
          $app | Stop-Process
          $app.WaitForExit()

          $uninstall = Start-Process -FilePath $uninstaller -ArgumentList '/S' -PassThru -Wait
          if ($uninstall.ExitCode -ne 0 -or (Test-Path -LiteralPath $installed) -or (Test-Path $key) -or
              (Get-ItemProperty -Path $runKey -ErrorAction SilentlyContinue).KnoooStudio) {
            throw 'Uninstall did not remove Knooo and its startup registration'
          }

  publish:
    needs: smoke-windows
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: windows-x64
      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha256sum --check SHA256SUMS.txt
          release_flags=()
          if [[ "${GITHUB_REF_NAME%%+*}" == *-* ]]; then
            release_flags+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --notes-file release-notes.md "${release_flags[@]}" \
            Knooo-windows-x64.exe Knooo-Setup-windows-x64.exe SHA256SUMS.txt
