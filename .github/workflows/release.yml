name: Windows x64 release

on:
  push:
    tags:
      - 'v[0-9]*'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.23.1'
          cache: npm
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: '1.27.4'
      - name: Extract release notes
        run: |
          mkdir -p build
          bash packaging/release-notes.sh "$GITHUB_REF_NAME" > build/release-notes.md
      - name: Build frontend and test backend
        run: |
          npm ci --registry=https://registry.npmjs.org --replace-registry-host=always
          npm run build
          go test ./...
      - name: Build Windows x64 packages
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.+-]+)?$ ]]; then
            echo "Use a version tag such as v0.1.0 or v0.1.0-rc.1."
            exit 1
          fi
          sudo apt-get update
          sudo apt-get install -y nsis=3.09-4ubuntu1 nsis-common=3.09-4ubuntu1
          mkdir -p build
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -buildvcs=false \
            -ldflags "-X main.version=$version" -o build/Knooo-windows-x64.exe .
          makensis -WX -DAPP_VERSION="$version" packaging/windows.nsi
          cd build
          sha256sum Knooo-windows-x64.exe Knooo-Setup-windows-x64.exe > SHA256SUMS.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: windows-x64
          path: |
            build/Knooo-windows-x64.exe
            build/Knooo-Setup-windows-x64.exe
            build/SHA256SUMS.txt
            build/release-notes.md
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: windows-x64
      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha256sum --check SHA256SUMS.txt
          release_flags=()
          if [[ "${GITHUB_REF_NAME%%+*}" == *-* ]]; then
            release_flags+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --notes-file release-notes.md "${release_flags[@]}" \
            Knooo-windows-x64.exe Knooo-Setup-windows-x64.exe SHA256SUMS.txt
